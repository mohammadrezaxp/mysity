name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mysity
          POSTGRES_USER: mysity
          POSTGRES_PASSWORD: mysity
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U mysity"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://mysity:mysity@localhost:5432/mysity
      SECRET_KEY: ci-only-test-key-not-for-deployment
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=untitled2.settings
      - run: python manage.py makemigrations --check --dry-run --settings=untitled2.settings
      - run: pytest -q
      - run: python manage.py spectacular --file schema.yml --validate --fail-on-warn --settings=untitled2.settings
      - run: docker build -t mysity:ci .
