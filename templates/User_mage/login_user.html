{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',sans-serif;min-height:100vh;background:linear-gradient(-45deg,#0f0c29,#302b63,#24f2a8,#0f0c29);background-size:400%400%;animation:gradientShift 15s ease infinite;display:flex;align-items:center;justify-content:center;padding:20px}
        @keyframes gradientShift{0%{background-position:0%50%}50%{background-position:100%50%}100%{background-position:0%50%}}
        .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.4;animation:float 20s infinite;pointer-events:none;z-index:0}
        .orb-1{width:400px;height:400px;background:#6ee7b7;top:-100px;right:-100px}
        .orb-2{width:300px;height:300px;background:#34d399;bottom:-50px;left:-50px;animation-delay:-7s}
        .orb-3{width:250px;height:250px;background:#10b981;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-14s}
        @keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-30px) scale(1.05)}50%{transform:translate(-20px,20px) scale(0.95)}75%{transform:translate(20px,30px) scale(1.02)}}
        .login-card{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,0.15);padding:50px 40px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);animation:slideUp 0.8s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .header{text-align:center;margin-bottom:40px;animation:fadeIn 1s ease 0.2s both}
        .header h1{color:#fff;font-size:2rem;font-weight:700;margin-bottom:10px}
        .header p{color:rgba(255,255,255,0.7);font-size:0.95rem}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        .messages{margin-bottom:20px}
        .message{padding:12px 16px;border-radius:12px;margin-bottom:10px;font-size:0.9rem;animation:shake 0.5s ease}
        .message.success{background:rgba(34,197,94,0.2);color:#86efac;border:1px solid rgba(34,197,94,0.3)}
        .message.error{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
        .message.info{background:rgba(59,130,246,0.2);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        .form-group{margin-bottom:25px;animation:fadeIn 0.6s ease both}
        .form-group:nth-child(2){animation-delay:0.3s}
        .form-group:nth-child(3){animation-delay:0.4s}
        .form-group label{display:block;color:rgba(255,255,255,0.8);font-size:0.85rem;margin-bottom:10px;font-weight:500}
        .input-wrapper{position:relative}
        .input-wrapper input{width:100%;padding:16px 20px 16px 50px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:14px;color:#fff;font-size:1rem;font-family:inherit;transition:all 0.3s ease;outline:none}
        .input-wrapper input::placeholder{color:rgba(255,255,255,0.4)}
        .input-wrapper input:focus{background:rgba(255,255,255,0.12);border-color:rgba(52,211,153,0.6);box-shadow:0 0 0 3px rgba(52,211,153,0.15)}
        .input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.5);font-size:18px}
        .options{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;animation:fadeIn 0.6s ease 0.5s both}
        .remember{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.7);font-size:0.9rem;cursor:pointer}
        .remember input{width:18px;height:18px;accent-color:#34d399}
        .forgot{color:#6ee7b7;text-decoration:none;font-size:0.9rem;transition:color 0.3s}
        .forgot:hover{color:#a7f3d0;text-decoration:underline}
        .btn-login{width:100%;padding:16px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:14px;color:#fff;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.3s ease;position:relative;overflow:hidden;animation:fadeIn 0.8s ease 0.6s both}
        .btn-login::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s ease}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,0.4)}
        .btn-login:hover::before{left:100%}
        .signup-extra{text-align:center;margin-top:30px;color:rgba(255,255,255,0.7);font-size:0.95rem;animation:fadeIn 0.8s ease 0.9s both}
        .signup-extra a{color:#6ee7b7;text-decoration:none;font-weight:600;transition:color 0.3s}
        .signup-extra a:hover{color:#a7f3d0;text-decoration:underline}
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="login-card">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        <form method="POST" action="{% url 'User_manage:login' %}">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">&#128100;</span>
                    <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">&#128274;</span>
                    <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>
            <div class="options">
                <label class="remember"><input type="checkbox" name="remember">Remember me</label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login">Sign In &#8594;</button>
        </form>
        <div class="signup-extra">Do you have account? <a href="{% url 'User_manage:sing_up' %}">Create account</a></div>
    </div>
</body>
</html>
